  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #020208; font-family: 'Space Grotesk', 'Inter', sans-serif;
    }

    /* CANVAS */
    #neural-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0;
    }

    /* GRID OVERLAY */
    .grid-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
      background-image:
        linear-gradient(rgba(230,57,70,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230,57,70,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
    }

    /* SCANLINE EFFECT */
    .scanline {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }

    /* VIGNETTE */
    .vignette {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse 120% 120% at 50% 50%, transparent 40%, rgba(2,2,8,0.8) 100%);
    }

    /* CONTENT */
    .content {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; text-align: center; padding: 24px;
      opacity: 0; animation: fadeInContent 1.5s ease forwards;
      animation-delay: 1.2s;
    }
    @keyframes fadeInContent {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* CLUB LOGO */
    .club-logo-wrap {
      position: relative; margin-bottom: 36px;
    }
    .club-logo {
      width: 120px; height: 120px; border-radius: 50%;
      background-image: url(images-1/clublogo.jpeg); background-size: cover; background-position: center;
      border: 3px solid #e63946;
      box-shadow: 0 0 0 0 rgba(230,57,70,0.4);
      animation: logo-pulse 2.5s ease-in-out infinite;
    }
    @keyframes logo-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(230,57,70,0.4), 0 0 30px rgba(230,57,70,0.3); }
      50%  { box-shadow: 0 0 0 20px rgba(230,57,70,0), 0 0 60px rgba(230,57,70,0.4); }
      100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.4), 0 0 30px rgba(230,57,70,0.3); }
    }
    .club-logo-ring {
      position: absolute; top: -8px; left: -8px;
      width: 136px; height: 136px; border-radius: 50%;
      border: 1px solid rgba(230,57,70,0.3);
      animation: spin-slow 12s linear infinite;
    }
    .club-logo-ring::after {
      content: ''; position: absolute; top: -2px; left: 50%;
      width: 6px; height: 6px; border-radius: 50%; background: #e63946;
      margin-left: -3px;
    }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* TITLE */
    .main-title {
      font-size: clamp(36px, 8vw, 80px); font-weight: 900; letter-spacing: -2px;
      line-height: 1; margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #e8e8e8 30%, #e63946 70%, #ff8a95 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .sub-title {
      font-size: clamp(12px, 2.5vw, 18px); font-weight: 400; color: rgba(255,255,255,0.45);
      letter-spacing: 4px; text-transform: uppercase; margin-bottom: 6px;
    }
    .institute-text {
      font-size: clamp(10px, 1.8vw, 13px); font-weight: 500; color: rgba(255,255,255,0.25);
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 48px;
    }

    /* LIVE INDICATOR */
    .live-badge {
      display: flex; align-items: center; gap: 8px; margin-bottom: 40px;
      background: rgba(230,57,70,0.1); border: 1px solid rgba(230,57,70,0.3);
      border-radius: 50px; padding: 6px 16px; font-size: 12px; color: rgba(230,57,70,0.9);
      font-weight: 700; letter-spacing: 1px;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #e63946;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

    /* ENTER BUTTON */
    .enter-btn {
      display: inline-flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, #e63946, #c0392b);
      color: white; text-decoration: none; font-size: 16px; font-weight: 700;
      padding: 16px 44px; border-radius: 100px;
      box-shadow: 0 0 0 0 rgba(230,57,70,0.5), 0 8px 32px rgba(230,57,70,0.35);
      transition: all 0.3s; letter-spacing: 0.5px;
      animation: btn-glow 2s ease-in-out infinite;
    }
    @keyframes btn-glow {
      0%,100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.5), 0 8px 32px rgba(230,57,70,0.35); }
      50% { box-shadow: 0 0 0 8px rgba(230,57,70,0), 0 12px 48px rgba(230,57,70,0.5); }
    }
    .enter-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 16px 56px rgba(230,57,70,0.5);
    }
    .enter-btn svg { width: 18px; height: 18px; }

    /* STATS ROW */
    .stats-row {
      display: flex; gap: 32px; margin-top: 48px; flex-wrap: wrap; justify-content: center;
    }
    .stat-item { text-align: center; }
    .stat-num { font-size: 24px; font-weight: 900; color: #e63946; letter-spacing: -0.5px; }
    .stat-lbl { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

    /* VERSION TAG */

  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // NEURAL NETWORK CANVAS ANIMATION
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');

    let W, H, nodes = [], dataPackets = [], frame = 0;
    const NODE_COUNT = 55;
    const CONNECT_DIST = 180;
    const PRIMARY = [230, 57, 70];
    const SECONDARY = [69, 123, 157];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', () => { resize(); initNodes(); });
    resize();

    class Node {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.r = Math.random() * 3 + 2;
        this.pulse = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 0.02 + 0.008;
        this.type = Math.random() < 0.15 ? 'hub' : 'node';
        if (this.type === 'hub') { this.r = Math.random() * 3 + 5; }
        this.active = false;
        this.activationTimer = 0;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.pulse += this.speed;
        if (this.activationTimer > 0) this.activationTimer--;
        if (this.x < -50) this.x = W + 50;
        if (this.x > W + 50) this.x = -50;
        if (this.y < -50) this.y = H + 50;
        if (this.y > H + 50) this.y = -50;
      }
      draw() {
        const pulseFactor = Math.sin(this.pulse) * 0.3 + 0.7;
        const r = this.r * (this.activationTimer > 0 ? 1.5 : 1);
        const alpha = this.type === 'hub' ? 0.9 : 0.6 + pulseFactor * 0.3;

        if (this.type === 'hub') {
          // Glow
          const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 5);
          grd.addColorStop(0, `rgba(${PRIMARY.join(',')}, ${alpha * 0.35})`);
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.beginPath();
          ctx.arc(this.x, this.y, r * 5, 0, Math.PI * 2);
          ctx.fillStyle = grd;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fillStyle = this.type === 'hub'
          ? `rgba(${PRIMARY.join(',')}, ${alpha})`
          : `rgba(${SECONDARY.join(',')}, ${alpha * 0.8})`;
        ctx.fill();

        if (this.type === 'hub') {
          ctx.strokeStyle = `rgba(${PRIMARY.join(',')}, 0.5)`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    class DataPacket {
      constructor(from, to) {
        this.from = from; this.to = to; this.t = 0; this.speed = Math.random() * 0.015 + 0.008;
      }
      update() { this.t += this.speed; return this.t >= 1; }
      draw() {
        const x = this.from.x + (this.to.x - this.from.x) * this.t;
        const y = this.from.y + (this.to.y - this.from.y) * this.t;
        const grd = ctx.createRadialGradient(x, y, 0, x, y, 6);
        grd.addColorStop(0, `rgba(${PRIMARY.join(',')}, 0.9)`);
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,0.95)`;
        ctx.fill();
      }
    }

    function initNodes() {
      nodes = [];
      for (let i = 0; i < NODE_COUNT; i++) nodes.push(new Node());
    }
    initNodes();

    function drawConnections() {
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < CONNECT_DIST) {
            const alpha = (1 - dist / CONNECT_DIST) * 0.35;
            const isActive = nodes[i].activationTimer > 0 || nodes[j].activationTimer > 0;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.strokeStyle = isActive
              ? `rgba(${PRIMARY.join(',')}, ${alpha * 2})`
              : `rgba(${SECONDARY.join(',')}, ${alpha})`;
            ctx.lineWidth = isActive ? 1.5 : 0.8;
            ctx.stroke();
          }
        }
      }
    }

    function spawnPacket() {
      const hubs = nodes.filter(n => n.type === 'hub');
      if (hubs.length < 2) return;
      const from = hubs[Math.floor(Math.random() * hubs.length)];
      let to;
      do { to = hubs[Math.floor(Math.random() * hubs.length)]; } while (to === from);
      dataPackets.push(new DataPacket(from, to));
      from.activationTimer = 30;
    }

    function drawBackground() {
      // Deep dark gradient
      const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
      bg.addColorStop(0, 'rgba(10,8,20,1)');
      bg.addColorStop(0.5, 'rgba(5,4,12,1)');
      bg.addColorStop(1, 'rgba(2,2,8,1)');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Ambient red glow at center
      const glow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.5);
      glow.addColorStop(0, 'rgba(230,57,70,0.06)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
    }

    function drawFloatingParticles() {
      const t = frame * 0.005;
      for (let i = 0; i < 20; i++) {
        const seed = i * 137.508;
        const x = (Math.sin(seed) * 0.5 + 0.5) * W;
        const y = ((Math.sin(seed * 0.7 + t * (0.3 + i * 0.02)) * 0.5 + 0.5) * H);
        const size = (Math.sin(seed * 1.3) * 0.5 + 0.5) * 1.5 + 0.5;
        const alpha = (Math.sin(seed + t) * 0.5 + 0.5) * 0.25;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${PRIMARY.join(',')}, ${alpha})`;
        ctx.fill();
      }
    }

    function animate() {
      frame++;
      drawBackground();
      drawFloatingParticles();
      drawConnections();
      nodes.forEach(n => { n.update(); n.draw(); });

      // Update packets
      dataPackets = dataPackets.filter(p => {
        const done = p.update();
        if (!done) p.draw();
        else { p.to.activationTimer = 40; }
        return !done;
      });

      // Spawn packets
      if (frame % 50 === 0) spawnPacket();

      requestAnimationFrame(animate);
    }
    animate();
  </script>

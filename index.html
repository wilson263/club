<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intro-page</title>
    <style>
        body{
            margin:0;
            padding: 0;
            position: relative;
        }
        #big-video{
            position: fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            object-fit: cover;
            z-index: -1;
        }
        .video-overlay{
            position: fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background: rgba(0,0,0,0.6);
            z-index: -1;
        }
        h1,h3{
            margin:0;
            padding:0;
            line-height: 1.1;
            font-weight: bold;
            font-family: sans-serif;
        }
        h1{
           font-size: 50px;
        }
        h3{
            font-size: 20px;
            margin-left: 40px;
        }
        button{
            padding:10px 0 10px 0;
            border-radius: 30px;
            border:none;
            font-size: 13px;
        }
        button:hover{
            background-color: rgb(109, 20, 20);
        }
        .content{
            position: fixed;
            bottom:50px;
            left:50%;
            transform: translate(-50%);
            display:flex;
            flex-direction: column;
            color:white;
            opacity: 1;
            animation:showcontent 1s forwards;
            animation-delay: 5.5s;
        }
        @keyframes showcontent{
            from{opacity:0;}
            to{opacity:1;}
        }
        @media (max-width:600px){
            h1{
                font-size: 30px;
            }
            h3{
                font-size: 13px;
                margin-left:15px;
            }
            button{
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <video autoplay muted playsinline  id="big-video">
        <source src="images-1/intro.mp4" type="video/mp4">
    </video>
   <div class="video-overlay"></div>
   <div class="content">
    <h1>Neural Nexus Club</h1>
    <h3>Artificial Intelligence & Data Science</h3>
    <button><a href="home-2.html" style="text-decoration: none; color:black">view profile</a></button>
   </div>
</body>
</html>
